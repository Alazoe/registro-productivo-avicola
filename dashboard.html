<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AviVet — Monitor de Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --fondo:    #f5f1e8;
  --fondo-2:  #f0ebe0;
  --papel:    #fefefe;
  --tinta:    #1c2118;
  --suave:    #4d5748;
  --tenue:    #6a7565;
  --linea:    #ddd8cc;
  --linea-f:  #c9c2b2;
  --prim:     #2a5430;
  --prim-osc: #1e3d22;
  --prim-mid: #3d7a42;
  --verde-cl: #e4ede5;
  --acento:   #b8860b;
  --ok:       #2f7d32;
  --mal:      #b03a2e;
  --alerta:   #c2691c;
  --fuente-t: 'Fraunces', Georgia, serif;
  --fuente-c: 'DM Sans', system-ui, sans-serif;
  --fuente-m: 'IBM Plex Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--fuente-c);
  font-size: 15px; line-height: 1.55;
  color: var(--tinta); background: var(--fondo);
  -webkit-font-smoothing: antialiased;
}
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
select, input { font-family: inherit; }
.print-only { display: none; }

/* LOGIN */
#login-screen {
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  background: var(--prim);
  background-image:
    radial-gradient(circle at 30% 20%, rgba(92,158,97,.18) 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, rgba(184,134,11,.12) 0%, transparent 50%);
  padding: 20px;
}
#login-card, #recovery-card {
  background: var(--papel); border-top: 4px solid var(--acento); border-radius: 14px;
  padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(10,16,10,.35);
}
#login-card .marca, #recovery-card .marca { font-family: var(--fuente-t); font-size: 30px; font-weight: 600; color: var(--prim); text-align: center; margin-bottom: 2px; letter-spacing: -.01em; }
#login-card .marca span, #recovery-card .marca span { color: var(--acento); }
#login-card .sub, #recovery-card .sub { font-size: 12px; color: var(--acento); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-align: center; margin-bottom: 28px; }
#login-card label, #recovery-card label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--tenue); display: block; margin-bottom: 5px; }
#login-card input, #recovery-card input {
  width: 100%; font-size: 15px;
  padding: 11px 13px; border: 1px solid var(--linea-f); border-radius: 8px;
  background: var(--fondo); color: var(--tinta); margin-bottom: 14px;
  transition: border-color .2s, box-shadow .2s; outline: none;
}
#login-card input:focus, #recovery-card input:focus { border-color: var(--prim-mid); box-shadow: 0 0 0 3px rgba(61,122,66,.15); }
#btn-login, #btn-rec {
  width: 100%; background: var(--prim); color: #fff;
  font-size: 15px; font-weight: 600;
  letter-spacing: .03em; padding: 13px; border-radius: 8px; transition: background .15s; margin-top: 4px;
}
#btn-login:hover:not(:disabled), #btn-rec:hover:not(:disabled) { background: var(--prim-osc); }
#btn-login:disabled, #btn-rec:disabled { opacity: .55; cursor: default; }
#login-error { color: var(--mal); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }

/* APP */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* HEADER */
#topbar {
  background: var(--prim); border-bottom: 3px solid var(--acento);
  padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(42,84,48,.25);
}
.marca-top { display: flex; align-items: baseline; gap: 14px; }
.marca-titulo { font-family: var(--fuente-t); font-size: 24px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
.marca-titulo span { color: var(--acento); }
.marca-sub-top { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.6); letter-spacing: .1em; text-transform: uppercase; }
.topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#fecha-hoy { font-size: 12px; color: rgba(255,255,255,.6); }
.btn-logout {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  color: rgba(255,255,255,.7); padding: 6px 12px;
  border: 1px solid rgba(255,255,255,.28); border-radius: 6px; text-transform: uppercase; transition: all .18s;
}
.btn-logout:hover { color: #fff; border-color: rgba(255,255,255,.6); }

/* LAYOUT */
#body { display: grid; grid-template-columns: 236px 1fr; flex: 1; }

/* SIDEBAR */
#sidebar {
  background: var(--papel); border-right: 1px solid var(--linea);
  padding: 20px 0; display: flex; flex-direction: column;
}
.sidebar-section { padding: 0 14px 16px; border-bottom: 1px solid var(--linea); margin-bottom: 16px; }
.sidebar-section:last-of-type { border-bottom: none; margin-bottom: 0; }
.sidebar-label { font-size: 11px; font-weight: 700; color: var(--tenue); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
.granja-btn {
  width: 100%; border-radius: 8px; padding: 9px 10px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 3px; transition: background .12s; border: 1px solid transparent; text-align: left;
}
.granja-btn:hover { background: var(--fondo); }
.granja-btn.activa { background: var(--verde-cl); border-color: rgba(42,84,48,.15); }
.granja-nombre { font-size: 14px; font-weight: 500; }
.lote-btn {
  width: 100%; border-radius: 6px; padding: 7px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-bottom: 2px; transition: background .12s; text-align: left;
}
.lote-btn:hover { background: var(--fondo); }
.lote-btn.activo { background: var(--fondo-2); }
.lote-nombre { font-size: 14px; color: var(--suave); }
.lote-btn.activo .lote-nombre { color: var(--tinta); font-weight: 600; }
.alert-tag { font-family: var(--fuente-m); font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; white-space: nowrap; }
.badge-num { font-family: var(--fuente-m); font-size: 10px; font-weight: 700; background: var(--mal); color: #fff; padding: 1px 7px; border-radius: 10px; }
.sidebar-alertas { margin: 0 12px; background: rgba(176,58,46,.05); border: 1px solid rgba(176,58,46,.2); border-radius: 8px; padding: 12px; }
.sidebar-alertas-titulo { font-size: 10px; font-weight: 700; color: var(--mal); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
.alerta-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }

/* MAIN */
#main { padding: 28px 32px; overflow-y: auto; min-width: 0; }

/* HEADER LOTE */
.lote-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; border-bottom: 1px solid var(--linea); padding-bottom: 20px; }
.lote-header-meta { font-size: 11px; font-weight: 600; color: var(--tenue); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.lote-header-titulo { font-family: var(--fuente-t); font-size: 38px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.lote-header-sub { font-size: 14px; color: var(--tenue); margin-top: 6px; }
.dias-badge { text-align: center; padding: 14px 20px; border-radius: 10px; min-width: 96px; border: 1px solid var(--linea); background: var(--papel); }
.dias-badge-num { font-family: var(--fuente-t); font-size: 44px; font-weight: 600; line-height: 1; }
.dias-badge-lbl { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }

/* KPIs */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--papel); border: 1px solid var(--linea); border-right: 0; border-bottom: 0; border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
.kpi-card { background: var(--papel); padding: 20px 18px; position: relative; border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.kpi-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-label { font-size: 10px; font-weight: 700; color: var(--tenue); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
.kpi-value { font-family: var(--fuente-t); font-size: 40px; font-weight: 600; line-height: 1; }
.kpi-sub { font-size: 13px; color: var(--tenue); margin-top: 6px; }

/* CHART */
.chart-wrap { background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; padding: 22px 22px 18px; margin-bottom: 24px; }
.chart-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.chart-titulo { font-size: 11px; font-weight: 700; color: var(--tenue); letter-spacing: .1em; text-transform: uppercase; }
.chart-controles { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.vista-tabs { display: flex; border: 1px solid var(--linea-f); border-radius: 6px; overflow: hidden; }
.vista-tab {
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; padding: 6px 14px; color: var(--tenue);
  background: var(--papel); border-right: 1px solid var(--linea-f);
  transition: all .15s;
}
.vista-tab:last-child { border-right: none; }
.vista-tab:hover { background: var(--fondo); color: var(--tinta); }
.vista-tab.activo { background: var(--prim); color: #fff; }
.chart-leyenda { display: flex; gap: 16px; font-size: 13px; color: var(--tenue); }
.chart-leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.chart-canvas-wrap { position: relative; height: 240px; width: 100%; }
.pending-aviso {
  display: flex; align-items: center; gap: 8px; margin-top: 14px;
  padding: 9px 14px; border-radius: 6px; font-size: 13px; border: 1px dashed;
}

/* CLASIFICACIÓN */
.clasif-wrap { background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; padding: 22px; }
.clasif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.clasif-titulo { font-size: 11px; font-weight: 700; color: var(--tenue); letter-spacing: .1em; text-transform: uppercase; }
.barra { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 1px; margin-bottom: 14px; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--suave); }
.leyenda-item { display: inline-flex; align-items: center; gap: 5px; }
.cuad { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.nc-titulo { font-size: 10px; font-weight: 700; color: var(--mal); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }

/* ESTADO VACÍO */
.estado-msg { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 360px; gap: 12px; }
.estado-msg-titulo { font-family: var(--fuente-t); font-size: 24px; color: var(--tenue); }
.estado-msg-sub { font-size: 14px; color: var(--tenue); text-align: center; max-width: 380px; line-height: 1.6; }

/* ALERTA TOPBAR */
.alerta-top {
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 5px 12px; border-radius: 6px;
  background: rgba(176,58,46,.28); color: #ffd9d3; border: 1px solid rgba(176,58,46,.45);
}

/* RESUMEN */
.btn-resumen {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  color: rgba(255,255,255,.85); padding: 6px 14px;
  border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
  text-transform: uppercase; transition: all .18s; background: rgba(255,255,255,.08);
}
.btn-resumen:hover  { background: rgba(255,255,255,.18); color: #fff; }
.btn-resumen.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn-resumen:disabled { opacity: .6; cursor: default; }

.resumen-wrap { max-width: 960px; }
.resumen-header { margin-bottom: 24px; border-bottom: 1px solid var(--linea); padding-bottom: 18px; }
.resumen-titulo { font-family: var(--fuente-t); font-size: 34px; font-weight: 600; color: var(--prim); line-height: 1.1; letter-spacing: -.01em; }
.resumen-periodo { font-size: 11px; font-weight: 700; color: var(--tenue); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.resumen-aviso {
  margin-top: 12px; font-size: 13px; color: var(--alerta); background: rgba(194,105,28,.07);
  border: 1px solid rgba(194,105,28,.25); border-radius: 8px; padding: 8px 12px;
}
.resumen-aviso-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.resumen-aviso-chip { font-size: 12px; color: var(--tinta); background: var(--papel); border: 1px solid var(--linea); border-radius: 999px; padding: 2px 10px; }
.resumen-aviso-chip b { font-family: var(--fuente-m); font-size: 11px; color: var(--alerta); }
.resumen-acciones { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
.btn-accion {
  font-size: 14px; font-weight: 600;
  padding: 9px 18px; border-radius: 8px; transition: all .15s; display: inline-flex; align-items: center; gap: 7px;
}
.btn-accion.prim  { background: var(--prim); color: #fff; }
.btn-accion.prim:hover { background: var(--prim-osc); }
.btn-accion.sec   { background: var(--papel); color: var(--suave); border: 1px solid var(--linea-f); }
.btn-accion.sec:hover { border-color: var(--prim); color: var(--prim); }
.sel { font-size: 14px; padding: 8px 10px; border: 1px solid var(--linea-f); border-radius: 8px; background: var(--papel); color: var(--tinta); cursor: pointer; }

.resumen-grid { display: grid; gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: 10px; margin-bottom: 22px; overflow-x: auto; }
.resumen-fila {
  display: grid;
  grid-template-columns: 190px 80px 140px 95px 125px 95px 105px;
  min-width: 830px;
  background: var(--papel);
  align-items: center;
}
.resumen-fila.cabecera { background: var(--prim); }
.resumen-cel { padding: 10px 14px; font-size: 14px; border-right: 1px solid var(--linea); }
.resumen-cel:last-child { border-right: none; }
.resumen-fila.cabecera .resumen-cel {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: rgba(255,255,255,.85); border-right-color: rgba(255,255,255,.12);
}
.resumen-fila:not(.cabecera):hover { background: var(--fondo); }
.resumen-productor { font-weight: 600; font-size: 14px; }
.resumen-lote { font-size: 12px; color: var(--tenue); margin-top: 1px; }
.resumen-num { font-family: var(--fuente-t); font-size: 24px; font-weight: 600; line-height: 1; }
.resumen-sub { font-family: var(--fuente-m); font-size: 10px; color: var(--tenue); margin-top: 3px; }
.semaforo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.semaforo-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.delta-chip { font-family: var(--fuente-m); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: inline-block; }
.resumen-pendiente { background: repeating-linear-gradient(45deg, var(--fondo), var(--fondo) 4px, var(--papel) 4px, var(--papel) 8px); }
.resumen-pie { font-size: 13px; color: var(--tenue); line-height: 1.6; padding: 14px; background: var(--papel); border: 1px solid var(--linea); border-radius: 8px; }
.btn-mini {
  margin-top: 6px; font-size: 11px; font-weight: 600; background: none;
  border: 1px solid var(--linea); border-radius: 6px; color: var(--suave); padding: 3px 9px; cursor: pointer;
}
.btn-mini:hover { border-color: var(--prim); color: var(--prim); }

.nav-semana-btn {
  font-family: var(--fuente-m); font-size: 14px; font-weight: 700;
  width: 34px; height: 34px; border-radius: 6px;
  border: 1px solid var(--linea-f); background: var(--papel); color: var(--prim);
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.nav-semana-btn:hover:not(:disabled) { background: var(--prim); color: #fff; border-color: var(--prim); }
.nav-semana-btn:disabled { color: var(--linea-f); cursor: default; }

/* FOOTER */
#footer {
  background: var(--papel); border-top: 1px solid var(--linea);
  padding: 8px 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  font-size: 11px; color: var(--tenue); letter-spacing: .04em;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  #body { grid-template-columns: 1fr; }
  #sidebar { border-right: none; border-bottom: 1px solid var(--linea); padding: 12px 0; }
  #sidebar .sidebar-section { padding-bottom: 10px; margin-bottom: 10px; }
  #lista-granjas, #lista-lotes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .granja-btn, .lote-btn { width: auto; flex: 0 0 auto; gap: 8px; }
  #alertas-panel-sidebar { display: none; }
  #main { padding: 18px 16px; }
  #fecha-hoy, .marca-sub-top { display: none; }
  .lote-header-titulo { font-size: 30px; }
  .kpi-value { font-size: 32px; }
  .resumen-titulo { font-size: 28px; }
}

/* IMPRESIÓN (Resumen → PDF) */
@media print {
  @page { margin: 12mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 12px; }
  #topbar, #footer, #sidebar, .resumen-acciones, .no-print, .pending-aviso { display: none !important; }
  .print-only { display: block !important; }
  #body { grid-template-columns: 1fr !important; }
  #main { padding: 0; overflow: visible; }
  .resumen-wrap { max-width: none; }
  .resumen-grid { overflow: visible; border-radius: 0; }
  .resumen-fila { min-width: 0; break-inside: avoid; grid-template-columns: 2fr 1fr 1.4fr 1fr 1.3fr 1fr 1.1fr; }
  .resumen-num { font-size: 18px; }
  .resumen-cel { padding: 7px 9px; font-size: 12px; }
  .resumen-header { margin-bottom: 14px; }
  .resumen-titulo { font-size: 26px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div id="login-card">
    <div class="marca">AVI<span>VET</span></div>
    <div class="sub">Monitor de Producción</div>
    <label for="login-email">Correo electrónico</label>
    <input type="email" id="login-email" autocomplete="email" placeholder="correo@ejemplo.com">
    <label for="login-pass">Contraseña</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button id="btn-login" onclick="login()">Entrar</button>
    <div id="login-error"></div>
    <div id="login-msg" style="color:var(--ok);font-size:12px;margin-top:10px;text-align:center;min-height:16px"></div>
    <p style="text-align:center;margin-top:12px"><a href="#" onclick="recuperarPassword();return false" style="font-size:12px;color:var(--acento);font-weight:600;text-decoration:none">¿Olvidaste tu contraseña?</a></p>
  </div>
</div>

<!-- NUEVA CONTRASEÑA -->
<div id="recovery-screen" style="display:none;position:fixed;inset:0;background:var(--prim);z-index:60;align-items:center;justify-content:center;padding:20px">
  <div id="recovery-card">
    <div class="marca">AVI<span>VET</span></div>
    <div class="sub">Nueva contraseña</div>
    <label for="rec-pass">Elige tu nueva clave</label>
    <input type="password" id="rec-pass" placeholder="••••••••" minlength="6" autocomplete="new-password">
    <button id="btn-rec" onclick="actualizarPassword()">Guardar contraseña</button>
    <div id="rec-error" style="color:var(--mal);font-size:12px;margin-top:10px;text-align:center;min-height:16px"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="marca-top">
      <div class="marca-titulo">AVI<span>VET</span></div>
      <div class="marca-sub-top">Monitor de Producción</div>
    </div>
    <div class="topbar-right">
      <div id="alerta-global"></div>
      <div id="fecha-hoy"></div>
      <button class="btn-resumen" id="btn-resumen" onclick="toggleResumen()" title="Resumen consolidado por semana, 4 semanas o mes">📋 Resumen</button>
      <button class="btn-resumen" id="btn-respaldo" onclick="exportarTodo()" title="Descarga un ZIP con los datos visibles para tu cuenta en CSV">⬇ Exportar todo</button>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div class="sidebar-section">

// ── HELPERS ────────────────────────────────────────────────────────────
// Fechas SIEMPRE en hora local (Chile): toISOString() usa UTC y desde las ~21:00 marca el día siguiente
const fmtISO = d => d.toLocaleDateString('en-CA');           // YYYY-MM-DD local
const hoyISO = () => fmtISO(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function refrescar() { modoResumen ? renderResumen() : render(); }
function alertColor(d) { return d===0?'var(--ok)':d<=1?'#c2691c':d<=2?'#a8471c':'var(--mal)'; }
function alertLabel(d) { return d===0?'Al día':d===1?'1 día':d+' días'; }

// ── AGRUPACIONES ───────────────────────────────────────────────────────
function getLunes(fechaStr) {
  const d = new Date(fechaStr + 'T12:00:00');
  const dia = d.getDay(); // 0=Dom
  const diff = dia === 0 ? -6 : 1 - dia;
  d.setDate(d.getDate() + diff);
  return fmtISO(d);
}

function agrupar(registros, vista) {
  if (vista === 'diario') {
    return registros.map(r => ({
      label: r.fecha.slice(5),   // MM-DD
      postura:  r.postura,
      esperado: r.esperado,
    }));
  }
  const grupos = {};
  registros.forEach(r => {
    const key = vista === 'semanal'
      ? getLunes(r.fecha)
      : r.fecha.slice(0, 7); // YYYY-MM
    if (!grupos[key]) grupos[key] = { key, posturas:[], esperados:[] };
    if (r.postura  != null) grupos[key].posturas.push(r.postura);
    if (r.esperado != null) grupos[key].esperados.push(r.esperado);
  });
  const avg = arr => arr.length ? parseFloat((arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1)) : null;
  return Object.values(grupos)
    .sort((a,b) => a.key.localeCompare(b.key))
    .map(g => ({
      label: vista === 'semanal'
        ? g.key.slice(5)                                      // MM-DD (lunes)
        : new Date(g.key + '-15').toLocaleDateString('es-CL', {month:'short', year:'2-digit'}),
      postura:  avg(g.posturas),
      esperado: avg(g.esperados),
    }));
}

// ── CHART ──────────────────────────────────────────────────────────────
function renderChart(lote, granja, vista) {
  const canvas = document.getElementById('chart-canvas');
  if (!canvas) return;
  if (chartInst) { chartInst.destroy(); chartInst = null; }

  const puntos = agrupar(lote.registros, vista);
  if (!puntos.length) {
    canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    return;
  }

  const color = granja.color;
  const colorAlpha = color + '20';

  chartInst = new Chart(canvas, {
    type: 'line',
    data: {
      labels: puntos.map(p => p.label),
      datasets: [
        {
          label: 'Postura real',
          data: puntos.map(p => p.postura),
          borderColor: color,
          backgroundColor: colorAlpha,
          borderWidth: 2.5,
          pointRadius: puntos.length > 60 ? 0 : 3.5,
          pointHoverRadius: 5,
          pointBackgroundColor: color,
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0.3,
          fill: false,
          spanGaps: true,
        },
        {
          label: 'Esperado',
          data: puntos.map(p => p.esperado),
          borderColor: '#c9c2b2',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [5, 4],
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          fill: false,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#fff',
          titleColor: '#1c2118',
          bodyColor: '#4d5748',
          borderColor: '#ddd8cc',
          borderWidth: 1,
          padding: 10,
          titleFont: { family: "'IBM Plex Mono'", size: 12 },
          bodyFont: { family: "'DM Sans'", size: 13 },
          callbacks: {
            title: items => {
              const lbl = items[0].label;
              if (vista === 'semanal') return 'Semana del ' + lbl;
              if (vista === 'mensual') return lbl;
              return lbl;
            },
            label: ctx => {
              const v = ctx.parsed.y;
              if (v == null) return null;
              return ' ' + ctx.dataset.label + ': ' + v + '%';
            },
          },
        },
      },
      scales: {
        x: {
          grid: { color: '#eee9de', drawBorder: false },
          ticks: {
            font: { family: "'IBM Plex Mono'", size: 10 },
            color: '#8a9384',
            maxRotation: 0,
            autoSkipPadding: 10,
            maxTicksLimit: Math.max(5, Math.min(vista === 'mensual' ? 12 : vista === 'semanal' ? 16 : 14, Math.floor((canvas.parentElement.clientWidth || 600) / 75))),
          },
          border: { display: false },
        },
        y: {
          grid: { color: '#ddd8cc', drawBorder: false },
          ticks: {
            font: { family: "'IBM Plex Mono'", size: 10 },
            color: '#8a9384',
            callback: v => v + '%',
            maxTicksLimit: 6,
          },
          border: { display: false },
        },
      },
    },
  });
}

// ── RENDER SIDEBAR ─────────────────────────────────────────────────────
function renderSidebar() {
  const listaG = document.getElementById('lista-granjas');
  listaG.innerHTML = '';
  GRANJAS.forEach(g => {
    const d = state.datos[g.id], est = state.estados[g.id];
    const nA = (d?.lotes||[]).filter(l=>l.diasPendientes>0).length;
    const activa = state.granjaId === g.id;
    const btn = document.createElement('button');
    btn.className = 'granja-btn' + (activa ? ' activa' : '');
    btn.onclick = () => { state.granjaId=g.id; state.loteIdx=0; render(); };
    const left = document.createElement('div');
    left.style.cssText = 'display:flex;align-items:center;gap:8px';
    const dot = document.createElement('div');
    Object.assign(dot.style, {width:'6px',height:'6px',borderRadius:'50%',flexShrink:'0',
      background: activa ? g.color : 'var(--linea-f)',
      boxShadow: activa ? `0 0 0 3px ${g.color}25` : ''});
    const nm = document.createElement('span');
    nm.className = 'granja-nombre';
    nm.style.color = activa ? g.color : 'var(--suave)';
    nm.textContent = g.nombre;
    left.append(dot, nm); btn.appendChild(left);
    if (est==='cargando') { const s=document.createElement('span'); s.style.cssText='font-size:10px;color:var(--tenue)'; s.textContent='···'; btn.appendChild(s); }
    else if (est==='error') { const s=document.createElement('span'); s.style.cssText='font-size:11px;color:var(--mal)'; s.textContent='✗'; btn.appendChild(s); }
    else if (est==='ok'&&nA>0) { const s=document.createElement('span'); s.className='badge-num'; s.textContent=nA; btn.appendChild(s); }
    else if (est==='ok') { const s=document.createElement('span'); s.style.cssText='font-size:11px;color:var(--ok)'; s.textContent='✓'; btn.appendChild(s); }
    listaG.appendChild(btn);
  });

  const granja = GRANJAS.find(g=>g.id===state.granjaId);
  const lotes  = state.datos[state.granjaId]?.lotes || [];
  document.getElementById('label-lotes').textContent = granja ? granja.nombre : 'Lotes';
  const listaL = document.getElementById('lista-lotes');
  listaL.innerHTML = '';

  // Opción "Todos los lotes" (vista combinada del productor)
  if (lotes.length > 1) {
    const bt = document.createElement('button');
    bt.className = 'lote-btn' + (state.loteIdx==='todos' ? ' activo' : '');
    bt.onclick = () => { state.loteIdx='todos'; render(); };
    const nm = document.createElement('span'); nm.className='lote-nombre'; nm.style.fontWeight='600';
    nm.textContent = '★ Todos los lotes';
    const tag = document.createElement('span'); tag.className='alert-tag';
    Object.assign(tag.style, {background:'var(--fondo)', color:'var(--suave)', border:'1px solid var(--linea)'});
    tag.textContent = lotes.length;
    bt.append(nm, tag); listaL.appendChild(bt);
  }

  lotes.forEach((l, i) => {
    const dias = l.diasPendientes||0, ac = alertColor(dias), activo = state.loteIdx===i;
    const btn = document.createElement('button');
    btn.className = 'lote-btn' + (activo ? ' activo' : '');
    btn.onclick = () => { state.loteIdx=i; render(); };
    const nm = document.createElement('span'); nm.className='lote-nombre'; nm.textContent=l.nombre;
    const tag = document.createElement('span'); tag.className='alert-tag';
    Object.assign(tag.style, {background: dias===0?'rgba(47,125,50,.12)':'rgba(176,58,46,.08)', color:ac, border:`1px solid ${ac}30`});
    tag.textContent = alertLabel(dias);
    btn.append(nm, tag); listaL.appendChild(btn);
  });

  const alertas = GRANJAS.flatMap(g => {
    const d = state.datos[g.id]; if (!d) return [];
    return (d.lotes||[]).filter(l=>l.diasPendientes>0)
      .map(l=>({granja:g.nombre,lote:l.nombre,dias:l.diasPendientes,color:g.color}));
  }).sort((a,b)=>b.dias-a.dias);

  const sbAl = document.getElementById('alertas-panel-sidebar');
  sbAl.innerHTML = '';
  if (alertas.length) {
    const panel = document.createElement('div'); panel.className='sidebar-alertas';
    const ttl = document.createElement('div'); ttl.className='sidebar-alertas-titulo'; ttl.textContent='⚠ Pendientes';
    panel.appendChild(ttl);
    alertas.slice(0,6).forEach(a => {
      const row = document.createElement('div'); row.className='alerta-row';
      const lft = document.createElement('span'); lft.style.color='var(--suave)';
      const dot = document.createElement('span'); dot.style.color=a.color; dot.textContent='● ';
      lft.append(dot, a.lote);
      const rgt = document.createElement('span');
      Object.assign(rgt.style, {color:alertColor(a.dias),fontWeight:'600',fontFamily:"'IBM Plex Mono',monospace",fontSize:'11px'});
      rgt.textContent = a.dias+'d';
      row.append(lft, rgt); panel.appendChild(row);
    });
    sbAl.appendChild(panel);
    const ag = document.getElementById('alerta-global'); ag.innerHTML='';
    const agEl = document.createElement('div'); agEl.className='alerta-top';
    agEl.textContent = '⚠ '+alertas.length+(alertas.length===1?' lote':' lotes')+' con datos pendientes';
    ag.appendChild(agEl);
  } else {
    document.getElementById('alerta-global').innerHTML='';
  }
}

// ── VISTA COMBINADA: todos los lotes de un productor ───────────────────
function renderMainTodos(main, granja, lotes) {
  if (chartInst) { chartInst.destroy(); chartInst = null; }

  // Header
  const header = document.createElement('div'); header.className='lote-header';
  const hLeft = document.createElement('div');
  const meta = document.createElement('div'); meta.className='lote-header-meta'; meta.textContent = granja.nombre;
  const titulo = document.createElement('div'); titulo.className='lote-header-titulo';
  titulo.textContent = 'Todos los lotes'; titulo.style.color = granja.color;
  const sub = document.createElement('div'); sub.className='lote-header-sub';
  const totalAves = lotes.reduce((s,l)=>s+(l.aves||0),0);
  sub.textContent = lotes.length + ' lotes · ' + totalAves.toLocaleString('es-CL') + ' aves';
  hLeft.append(meta, titulo, sub);
  header.append(hLeft); main.appendChild(header);

  // Gráfico combinado por semana de vida
  const chartWrap = document.createElement('div'); chartWrap.className='chart-wrap';
  const ttl = document.createElement('div'); ttl.className='chart-titulo';
  ttl.textContent = 'Postura por semana de vida'; ttl.style.marginBottom='4px';
  chartWrap.appendChild(ttl);
  const cvBox = document.createElement('div'); cvBox.style.cssText='position:relative;height:330px;margin-top:8px';
  const cv = document.createElement('canvas'); cvBox.appendChild(cv); chartWrap.appendChild(cvBox);
  main.appendChild(chartWrap);
  const series = lotes.map((l,i)=>({ label:l.nombre, registros:l.registros, color:PAL_LOTES[i%PAL_LOTES.length] }));
  chartInst = dibujarCurva(cv, series, { porSemana: true });

  // Tabla resumen por lote
  const tw = document.createElement('div');
  tw.style.cssText = 'margin-top:20px;border:1px solid var(--linea);border-radius:4px;overflow:auto';
  const tb = document.createElement('table');
  tb.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px';
  const cols = ['Lote','Sem','Postura','Esperado','Δ','Mort. hoy','Consumo','Huevos','Estado'];
  const thead = '<thead><tr>' + cols.map(c=>`<th style="background:var(--prim);color:#fff;text-align:left;padding:9px 10px;font-family:var(--fuente-m);font-size:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap">${c}</th>`).join('') + '</tr></thead>';
  const filas = lotes.map((l,i) => {
    const dif = l.diferencia;
    const difCol = dif==null ? 'var(--tenue)' : dif>=0 ? 'var(--ok)' : 'var(--mal)';
    const ac = alertColor(l.diasPendientes||0);
    const td = (html,extra='') => `<td style="padding:9px 10px;border-top:1px solid var(--linea);white-space:nowrap;${extra}">${html}</td>`;
    return `<tr style="cursor:pointer" onclick="state.loteIdx=${i};render()" onmouseover="this.style.background='var(--fondo)'" onmouseout="this.style.background=''">`

      + td(l.posturaEsperada!=null ? l.posturaEsperada+'%' : '—', 'color:var(--suave)')
      + td(dif!=null ? `<span style="color:${difCol};font-weight:600">${dif>0?'+':''}${dif}%</span>` : '—')
      + td(l.mortalidadHoy!=null ? l.mortalidadHoy+' av' : '—')
      + td(l.consumoGrAve!=null ? l.consumoGrAve+' g' : '—')
      + td(l.huevos!=null ? l.huevos.toLocaleString('es-CL') : '—')
      + td(`<span style="color:${ac};font-weight:600">${alertLabel(l.diasPendientes||0)}</span>`)
      + '</tr>';
  }).join('');
  tb.innerHTML = thead + '<tbody>' + filas + '</tbody>';

  nota.textContent = 'Cada línea es un lote alineado por semana de vida. Toca una fila para ver el detalle de ese lote.';
  main.appendChild(nota);
}

// ── RENDER MAIN ────────────────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById('contenido');
  main.innerHTML = '';
  if (chartInst) { chartInst.destroy(); chartInst = null; }

  const granja = GRANJAS.find(g=>g.id===state.granjaId);
  if (!granja) { main.innerHTML='<div class="estado-msg"><div class="estado-msg-titulo">Cargando productores…</div></div>'; return; }
  const est = state.estados[state.granjaId];
  const datosG = state.datos[state.granjaId];
  const lotes = datosG?.lotes || [];

  // Vista combinada: todos los lotes del productor
  if (state.loteIdx === 'todos' && lotes.length) { renderMainTodos(main, granja, lotes); return; }

  const lote  = lotes[state.loteIdx];

  if (!lote && est==='cargando') { main.innerHTML='<div class="estado-msg"><div class="estado-msg-titulo">Cargando datos…</div></div>'; return; }
  if (!lote && est==='error') {
    main.innerHTML=`<div class="estado-msg"><div style="font-size:32px">⚠</div><div class="estado-msg-titulo" style="color:var(--mal)">Error al conectar</div><div class="estado-msg-sub">No se pudo obtener datos de ${granja.nombre}.</div></div>`; return;
  }
  if (!lote) return;

  // ── Header lote ──
  const ac = alertColor(lote.diasPendientes);
  const header = document.createElement('div'); header.className='lote-header';
  const hLeft = document.createElement('div');
  const meta = document.createElement('div'); meta.className='lote-header-meta';
  meta.textContent = granja.nombre + ' · Semana ' + lote.semanaVida + ' de vida ';

// ── SUPABASE ───────────────────────────────────────────────────────────
// Token vigente: el SDK renueva la sesión cada hora; si la pestaña queda abierta, currentToken vencería
async function getToken() {
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { currentToken = session.access_token; currentUserId = session.user.id; }
  return currentToken;
}
async function sbFetch(tabla, params={}) {
  const url = new URL(SUPABASE_URL+'/rest/v1/'+tabla);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r = await fetch(url.toString(), { headers: {
    'apikey': SUPABASE_ANON,
    'Authorization': 'Bearer '+(await getToken()),
  }});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── EXPORTAR TODO (respaldo manual en ZIP) ─────────────────────────────
// Descarga en CSV todo lo que la sesión actual puede leer según RLS.
async function exportarTodo() {
  const btn = document.getElementById('btn-respaldo');
  const TABLAS = [
    ['productores','user_id'], ['ubicaciones','id'], ['lotes','id'], ['pesajes','id'],
    ['registros','id'], ['ventas','id'], ['pedidos','id'], ['ajustes_stock','id'],
    ['proveedores','id'], ['alimento_recepciones','id'], ['alimento_ajustes','id'],
    ['user_config','user_id'], ['equipo','id'],
  ];
  const PAGE = 1000;
  btn.disabled = true;
  const token = await getToken();
  const zip = new JSZip();
  let ok = 0, omitidas = 0;

  for (let i = 0; i < TABLAS.length; i++) {
    const [tabla, pk] = TABLAS[i];
    btn.textContent = `Exportando ${i+1}/${TABLAS.length}…`;
    try {
      let csv = '', desde = 0;
      while (true) {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*&order=${pk}.asc`, {
          headers: {
            'apikey': SUPABASE_ANON,
            'Authorization': 'Bearer ' + token,
            'Accept': 'text/csv',
            'Range-Unit': 'items',
            'Range': `${desde}-${desde + PAGE - 1}`,
          },
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const texto = await r.text();
        if (!texto.trim()) break;
        // Filas de la página según Content-Range ("0-999/*")
        const cr = r.headers.get('content-range') || '';
        const m = cr.match(/^(\d+)-(\d+)\//);
        const filas = m ? (parseInt(m[2]) - parseInt(m[1]) + 1) : 0;
        if (!filas) break;
        csv += desde === 0 ? texto : texto.slice(texto.indexOf('\n') + 1);
        if (!csv.endsWith('\n')) csv += '\n';
        if (filas < PAGE) break;
        desde += PAGE;
      }
      if (csv.trim() && csv.trim().includes('\n')) { zip.file(tabla + '.csv', csv); ok++; }
      else omitidas++;
    } catch (e) { omitidas++; }
  }

  btn.textContent = 'Generando ZIP…';
  try {
    if (!ok) { alert('No se pudo exportar ninguna tabla. Revisa tu conexión o permisos.'); return; }
    const hoy = new Date().toLocaleDateString('en-CA');
    zip.file('LEEME.txt',
      `Respaldo AviVet — ${hoy}\n` +
      `Exportado desde el Monitor de Producción con la cuenta de la sesión.\n` +
      `Contiene lo visible para esa cuenta según RLS: ${ok} tablas con datos, ${omitidas} vacías o sin acceso.\n`);
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `respaldo-avivet-${hoy}.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
  } finally {
    btn.disabled = false;
    btn.textContent = '⬇ Exportar todo';
  }
}

// Upsert (POST con resolución de conflicto) — usado para guardar overrides del asesor
async function sbUpsert(tabla, fila, onConflict) {
  const url = new URL(SUPABASE_URL+'/rest/v1/'+tabla);
  if (onConflict) url.searchParams.set('on_conflict', onConflict);
  const r = await fetch(url.toString(), {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer '+(await getToken()),
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify(fila),
  });
  if (!r.ok) throw new Error('HTTP '+r.status);
}

// Nombre legible: corrección del asesor > nombre propio > nombre antiguo > fragmento del UUID
function resolverNombreProductor(uid) {
  return overridesAsesor[uid] || nombresProductores[uid] || nombresLegacy[uid] || uid.slice(0,8);
}

// Carga los nombres puestos por los productores y las correcciones del asesor
async function cargarNombresProductores() {
  nombresProductores = {}; overridesAsesor = {};
  try {
    const prods = await sbFetch('productores', { 'select':'user_id,nombre' });
    prods.forEach(p => { if (p.nombre) nombresProductores[p.user_id] = p.nombre; });
  } catch(e) { console.warn('No se pudieron cargar nombres de productores:', e); }
  try {
    const cfg = await sbFetch('user_config', { 'select':'config', 'user_id':'eq.'+currentUserId });
    const ov = cfg?.[0]?.config?.nombresProductores;
    if (ov && typeof ov === 'object') overridesAsesor = ov;
  } catch(e) { console.warn('No se pudieron cargar correcciones del asesor:', e); }
}

// El asesor renombra a un productor (se guarda en su propia user_config)
async function renombrarProductor(uid) {
  const nuevo = prompt('Nombre para este productor:', overridesAsesor[uid] || nombresProductores[uid] || nombresLegacy[uid] || '');
  if (nuevo === null) return;
  const limpio = nuevo.trim();
  try {
    if (limpio) overridesAsesor[uid] = limpio;
    else delete overridesAsesor[uid];  // vacío = quitar corrección y volver al nombre propio/UUID
    // Releer config actual para no pisar otras preferencias del asesor
    let config = {};
    try {
      const cfg = await sbFetch('user_config', { 'select':'config', 'user_id':'eq.'+currentUserId });
      config = cfg?.[0]?.config || {};
    } catch(_) {}
    config.nombresProductores = overridesAsesor;
    await sbUpsert('user_config', { user_id: currentUserId, config, updated_at: new Date().toISOString() }, 'user_id');
    // Reflejar en la lista en memoria
    GRANJAS.forEach(g => { if (g.id === uid) g.nombre = resolverNombreProductor(uid); });
    GRANJAS.sort((a,b)=>a.nombre.localeCompare(b.nombre));
    refrescar();
  } catch(e) {
    alert('No se pudo guardar el nombre: '+e.message);
  }
}

function procesarLote(lote, registros) {
  if (!registros.length) return null;
  const hoy = hoyISO();
  const u   = registros[0]; // más reciente
  const dias = Math.max(0, Math.round((new Date(hoy)-new Date(u.fecha))/86400000));
  const pct  = v => v!=null ? parseFloat((v*100).toFixed(1)) : null;
  return {
    id:              lote.id,
    fechaNac:        lote.fecha_nac,
    nombre:          lote.nombre,
    semanaVida:      u.semana_vida,
    aves:            u.n_aves || lote.n_aves,
    ultimaFecha:     u.fecha,
    diasPendientes:  dias,
    postura:         pct(u.pct_postura),
    posturaEsperada: pct(u.pct_esperado),
    diferencia:      pct(u.diferencia),
    mortalidadHoy:   u.mortalidad,
    mortPctHoy:      (u.mortalidad!=null && (u.n_aves||lote.n_aves)) ? parseFloat((u.mortalidad/(u.n_aves||lote.n_aves)*100).toFixed(2)) : null,
    huevos:          u.n_huevos,
    gAlimPorHuevo:   (u.kg_alimento&&u.n_huevos) ? Math.round(u.kg_alimento*1000/u.n_huevos) : null,
    consumoGrAve:    (u.kg_alimento&&u.n_aves)   ? Math.round(u.kg_alimento*1000/u.n_aves)   : null,
    kgAlimentoHoy:   u.kg_alimento || null,
    clasificacion: {
      chico:u.chico, mediano:u.mediano, grande:u.grande, xl:u.xl,
      superXl:u.super_xl, jumbo:u.jumbo, sucios:u.sucios,
      rotos:u.rotos, trizados:u.trizados, sangre:u.sangre,
    },
    // Todos los registros ordenados del más antiguo al más reciente
    registros: [...registros].reverse().map(r=>({
      fecha:       r.fecha,
      semana:      r.semana_vida,
      postura:     pct(r.pct_postura),
      esperado:    pct(r.pct_esperado),
      n_huevos:    r.n_huevos || 0,
      mortalidad:  r.mortalidad || 0,
      n_aves:      r.n_aves || 0,
      kg_alimento: r.kg_alimento || 0,
    })),
  };
}

// Periodo según la agrupación elegida (semana / 4 semanas / mes cerrado) + offset de navegación
function getPeriodo() {
  const fmt = fmtISO;
  const hoy = new Date();

  if (agrupacion === 'mes') {
    // Último mes cerrado: el mes anterior, salvo que aún no pasen los 3 días de gracia (día 1-3) → el anterior a ese
    const cierre = new Date(hoy.getFullYear(), hoy.getMonth(), 4);
    const base = hoy >= cierre ? -1 : -2;
    const ini = new Date(hoy.getFullYear(), hoy.getMonth() + base + semanaOffset, 1);
    const fin = new Date(hoy.getFullYear(), hoy.getMonth() + base + semanaOffset + 1, 0);
    return { inicio:fmt(ini), fin:fmt(fin), esActual: semanaOffset===0, tipo:'mes',
             etiqueta: ini.toLocaleDateString('es-CL',{month:'long',year:'numeric'}) };
  }

  // semana / 4 semanas: ancladas al domingo (con 3 días de gracia)
  const nSem = agrupacion === '4semanas' ? 4 : 1;
  const diaSem = hoy.getDay();
  const diasHastaDom = diaSem === 0 ? 7 : diaSem;
  const ultimoDom = new Date(hoy); ultimoDom.setDate(hoy.getDate() - diasHastaDom);
  const graciaPasa = new Date(ultimoDom); graciaPasa.setDate(ultimoDom.getDate() + 3);
  const domBase = hoy >= graciaPasa ? ultimoDom : new Date(ultimoDom.getTime() - 7*86400000);
  const domFin = new Date(domBase.getTime() + semanaOffset * nSem * 7*86400000);
  const lunIni = new Date(domFin); lunIni.setDate(domFin.getDate() - (nSem*7 - 1));
  return { inicio:fmt(lunIni), fin:fmt(domFin), esActual: semanaOffset===0,
           tipo: nSem===4 ? '4semanas' : 'semana', etiqueta: nSem===4 ? '4 semanas' : 'Semana' };
}

// Periodo inmediatamente anterior, del mismo tamaño
function getPeriodoPrev(p) {
  const fmt = fmtISO;
  if (p.tipo === 'mes') {
    const ini = new Date(p.inicio+'T12:00:00');
    const pi = new Date(ini.getFullYear(), ini.getMonth()-1, 1);
    const pf = new Date(ini.getFullYear(), ini.getMonth(), 0);
    return { inicio:fmt(pi), fin:fmt(pf) };
  }
  const dias = Math.round((new Date(p.fin)-new Date(p.inicio))/86400000) + 1;
  const pf = new Date(new Date(p.inicio+'T12:00:00').getTime() - 86400000);
  const pi = new Date(pf.getTime() - (dias-1)*86400000);
  return { inicio:fmt(pi), fin:fmt(pf) };
}

// KPIs de un lote en un rango [inicio,fin]
function kpisLoteSemana(l, inicio, fin) {
  const regs = l.registros.filter(r => r.fecha >= inicio && r.fecha <= fin);
  if (!regs.length) return { dias:0 };
  const post = regs.map(r=>r.postura).filter(v=>v!=null);
  const esp  = regs.map(r=>r.esperado).filter(v=>v!=null);
  const prom = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const consumos = regs.filter(r=>r.n_aves>0 && r.kg_alimento>0).map(r=>r.kg_alimento/r.n_aves*1000);
  const avesIni = regs[0].n_aves || l.aves || 0;
  const mort = regs.reduce((s,r)=>s+(r.mortalidad||0),0);
  return {
    dias: regs.length,
    postura:  prom(post)!=null ? parseFloat(prom(post).toFixed(1)) : null,
    estandar: prom(esp)!=null  ? parseFloat(prom(esp).toFixed(1))  : null,
    huevos:   regs.reduce((s,r)=>s+(r.n_huevos||0),0),
    mort, avesIni,
    mortPct:  avesIni>0 ? parseFloat((mort/avesIni*100).toFixed(2)) : null,
    consumo:  consumos.length ? parseFloat((consumos.reduce((x,y)=>x+y,0)/consumos.length).toFixed(1)) : null,
  };
}

// Paleta para distinguir lotes en la curva combinada
const PAL_LOTES = ['#2a5430','#1e5a7a','#b8860b','#7a4b8c','#b03a2e','#c2691c','#5c6b3a','#3d7a42'];

// Estación de nacimiento (hemisferio sur / Chile) según la fecha de nacimiento
const ESTACIONES = ['Verano','Otoño','Invierno','Primavera'];
const COLOR_ESTACION = { Verano:'#e6a817', 'Otoño':'#c2691c', Invierno:'#1e5a7a', Primavera:'#3d7a42' };
function estacionNac(fechaNac) {
  if (!fechaNac) return null;
  const m = new Date(fechaNac+'T12:00:00').getMonth() + 1; // 1-12
  if (m===12 || m<=2) return 'Verano';
  if (m<=5)  return 'Otoño';
  if (m<=8)  return 'Invierno';
  return 'Primavera';
}

// Dibuja curva(s) de postura. series=[{label,registros,color}].
// opts.conEstandar añade la línea esperada (solo 1 serie).
// opts.porSemana usa la SEMANA DE VIDA como eje X (para comparar lotes alineados por edad).
function dibujarCurva(canvas, series, opts={}) {
  const { conEstandar=false, porSemana=false } = opts;
  let labels, ejeLabel, datasets;

  if (porSemana) {
    // Promedio de postura por semana de vida, por lote
    const sems = new Set();
    const agr = series.map(s => {
      const acc = {};
      s.registros.forEach(r => {
        if (r.semana==null || r.postura==null) return;
        sems.add(r.semana);
        (acc[r.semana] = acc[r.semana] || {sum:0,n:0});
        acc[r.semana].sum += r.postura; acc[r.semana].n++;
      });
      const mapa = {}; Object.entries(acc).forEach(([k,v]) => mapa[k] = parseFloat((v.sum/v.n).toFixed(1)));
      return { label:s.label, color:s.color, mapa };
    });
    const orden = [...sems].sort((a,b)=>a-b);
    labels = orden.map(w => 'Sem ' + w);
    ejeLabel = 'Semana de vida';
    datasets = agr.map(s => ({
      label: s.label,
      data: orden.map(w => w in s.mapa ? s.mapa[w] : null),
      borderColor: s.color, backgroundColor: 'transparent',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .3, spanGaps: true,
    }));
  } else {
    // Eje por fecha
    const setF = new Set();
    series.forEach(s => s.registros.forEach(r => setF.add(r.fecha)));
    const orden = [...setF].sort();
    labels = orden.map(f => f.slice(5).replace('-','/'));
    ejeLabel = 'Fecha';
    datasets = series.map(s => {
      const mapa = {}; s.registros.forEach(r => { mapa[r.fecha] = r.postura; });
      return {
        label: s.label,
        data: orden.map(f => f in mapa ? mapa[f] : null),
        borderColor: s.color, backgroundColor: 'transparent',
        borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .3, spanGaps: true,
      };
    });
    if (conEstandar && series.length === 1) {
      const mapaE = {}; series[0].registros.forEach(r => { mapaE[r.fecha] = r.esperado; });
      datasets.push({
        label: 'Estándar', data: orden.map(f => f in mapaE ? mapaE[f] : null),
        borderColor: '#c9c2b2', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [5,4], pointRadius: 0, tension: .3, spanGaps: true,
      });
    }
  }

  return new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { font: { size: 10 }, boxWidth: 14, usePointStyle: true } },
        tooltip: { callbacks: { label: ctx => ctx.parsed.y==null ? null : ' '+ctx.dataset.label+': '+ctx.parsed.y+'%' } },
      },
      scales: {
        x: { title: { display: true, text: ejeLabel, font: { size: 10 }, color: '#8a9384' },
             ticks: { font: { size: 9 }, color: '#8a9384', maxRotation: 0, autoSkipPadding: 10, maxTicksLimit: Math.max(5, Math.min(14, Math.floor((canvas.parentElement?.clientWidth || 600) / 75))) }, grid: { color: '#eee9de' } },
        y: { min: 0, max: 100, ticks: { font: { size: 9 }, color: '#8a9384', callback: v => v+'%' }, grid: { color: '#ddd8cc' } },
      },
    },
  });
}

// Panel desplegable para comparar postura normalizada por semana de vida.
// Modos: por lote (con marcar todos), por estación de nacimiento, o por avícola.
function panelComparacion(granjas) {
  const lotesAll = [];
  granjas.forEach(g => (state.datos[g.id]?.lotes || []).forEach(l => lotesAll.push({ l, g })));

  const wrapP = document.createElement('div'); wrapP.style.cssText = 'margin-bottom:24px';
  const btn = document.createElement('button'); btn.className = 'btn-accion sec';
  const TXT = '🔬 Comparar por semana de vida';
  btn.textContent = TXT;

  const cont = document.createElement('div');
  cont.style.cssText = 'display:none;background:var(--papel);border:1px solid var(--linea);border-radius:4px;padding:14px 16px;margin-top:10px';

  let chart = null, modo = 'lote';
  const seleccion = new Set(lotesAll.map(x => x.l.id));

  // Controles
  const ctrl = document.createElement('div');
  ctrl.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px';
  const lblModo = document.createElement('span');
  lblModo.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)';
  lblModo.textContent = 'Agrupar por';
  const selModo = document.createElement('select'); selModo.className = 'sel';
  selModo.innerHTML = [['lote','Lote'],['estacion','Estación de nacimiento'],['avicola','Avícola']]
    .map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
  const mkMini = txt => { const b=document.createElement('button'); b.className='nav-semana-btn'; b.textContent=txt; b.style.cssText+=';font-size:11px;padding:4px 10px'; return b; };
  const btnTodos = mkMini('Todos');
  const btnNada  = mkMini('Ninguno');
  ctrl.append(lblModo, selModo, btnTodos, btnNada);

  const chkWrap = document.createElement('div');
  chkWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;max-height:130px;overflow:auto';

  const cv = document.createElement('canvas'); cv.style.cssText = 'width:100%;max-height:320px';
  const vacio = document.createElement('div');
  vacio.style.cssText = 'padding:24px;text-align:center;color:var(--tenue);font-size:13px;display:none';
  vacio.textContent = 'Marca al menos un lote para ver la comparación.';

  function construirChecks() {
    chkWrap.innerHTML = '';
    lotesAll.forEach(({ l, g }) => {
      const lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tinta);cursor:pointer';
      const ch = document.createElement('input'); ch.type = 'checkbox'; ch.checked = seleccion.has(l.id);
      ch.onchange = () => { ch.checked ? seleccion.add(l.id) : seleccion.delete(l.id); redibujar(); };
      lbl.append(ch, document.createTextNode(l.nombre + ' · ' + g.nombre));
      chkWrap.appendChild(lbl);
    });
  }

  function series() {
    if (modo === 'lote') {
      return lotesAll.filter(x => seleccion.has(x.l.id))
        .map((x,i) => ({ label: x.l.nombre + ' · ' + x.g.nombre, registros: x.l.registros, color: PAL_LOTES[i%PAL_LOTES.length] }));
    }
    if (modo === 'estacion') {
      return ESTACIONES.map(est => {
        const regs = [];
        lotesAll.forEach(x => { if (estacionNac(x.l.fechaNac) === est) regs.push(...x.l.registros); });
        return regs.length ? { label: est, registros: regs, color: COLOR_ESTACION[est] } : null;
      }).filter(Boolean);
    }
    return granjas.map(g => {
      const d = state.datos[g.id]; if (!d || !d.lotes.length) return null;
      const regs = []; d.lotes.forEach(l => regs.push(...l.registros));
      return regs.length ? { label: g.nombre, registros: regs, color: g.color } : null;
    }).filter(Boolean);
  }

  function redibujar() {
    if (chart) { chart.destroy(); chart = null; }
    const s = series();
    vacio.style.display = s.length ? 'none' : 'block';
    cv.style.display = s.length ? 'block' : 'none';
    if (s.length) chart = dibujarCurva(cv, s, { porSemana: true });
  }

  selModo.onchange = () => {
    modo = selModo.value;
    const esLote = modo === 'lote';
    btnTodos.style.display = btnNada.style.display = esLote ? '' : 'none';
    chkWrap.style.display = esLote ? 'flex' : 'none';
    redibujar();
  };
  btnTodos.onclick = () => { lotesAll.forEach(x => seleccion.add(x.l.id)); construirChecks(); redibujar(); };
  btnNada.onclick  = () => { seleccion.clear(); construirChecks(); redibujar(); };

  cont.append(ctrl, chkWrap, vacio, cv);
  btn.onclick = () => {
    if (cont.style.display === 'none') {
      cont.style.display = 'block'; construirChecks(); redibujar(); btn.textContent = '✕ Ocultar comparación';
    } else {
      if (chart) { chart.destroy(); chart = null; }
      cont.style.display = 'none'; btn.textContent = TXT;
    }
  };

  wrapP.append(btn, cont);
  return wrapP;
}

  const navBtns = document.createElement('div');
  navBtns.style.cssText = 'display:flex;align-items:center;gap:6px';
  const btnPrev = document.createElement('button');
  btnPrev.className = 'nav-semana-btn'; btnPrev.textContent = '←';
  btnPrev.title = 'Periodo anterior'; btnPrev.onclick = () => navegarSemana(-1);
  const btnNext = document.createElement('button');
  btnNext.className = 'nav-semana-btn'; btnNext.textContent = '→';
  btnNext.title = 'Periodo siguiente';
  btnNext.disabled = semana.esActual;
  btnNext.onclick = () => navegarSemana(1);
  const uni = agrupacion==='mes'?'mes':agrupacion==='4semanas'?'bloque':'sem';
  const labelSem = document.createElement('span');
  labelSem.style.cssText = 'font-family:var(--fuente-m);font-size:10px;color:var(--tenue);letter-spacing:.06em;padding:0 4px;min-width:70px;text-align:center';
  labelSem.textContent = semana.esActual ? (agrupacion==='mes' ? 'Último cerrado' : 'Actual') : Math.abs(semanaOffset)+' '+uni+' atrás';

  // para saber a quién avisar antes de enviar el resumen
  const pendientes = [];
  granjasMostrar.forEach(g => {
    const d = state.datos[g.id]; if (!d) return;
    d.lotes.forEach(l => {
      const enPeriodo = l.registros.filter(r => r.fecha >= semana.inicio && r.fecha <= semana.fin);

    const aviso = document.createElement('div'); aviso.className = 'resumen-aviso';

      + `<div class="resumen-aviso-lista">` + pendientes.map(p => `<span class="resumen-aviso-chip">${esc(p.nombre)} <b>${p.dias}/${diasPeriodo}</b></span>`).join('') + `</div>`;
    hdr.appendChild(aviso);

  btnPrint.innerHTML = '🖨 Imprimir / PDF';
  btnPrint.onclick = () => window.print();
  const btnCopiar = document.createElement('button');
  btnCopiar.className = 'btn-accion sec';
  btnCopiar.innerHTML = '📋 Copiar texto';
  btnCopiar.title = 'Copia el resumen tal como se ve (respeta el productor filtrado). Ideal para WhatsApp o correo.';
  btnCopiar.onclick = () => copiarResumenTexto(semana, granjasMostrar, minDias, uniLbl);

    GRANJAS.map(g=>`<option value="${g.id}"${filtroProductor===g.id?' selected':''}>${esc(g.nombre)}</option>`).join('');
  sel.onchange = () => { filtroProductor = sel.value; renderResumen(); };

  hint.textContent = 'Filtra un productor y "Copiar texto" para enviarle solo lo suyo.';
  acciones.append(btnPrint, btnCopiar, sel, hint);
  wrap.appendChild(acciones);

  // ── Resumen general (totales de la semana, respeta el filtro) ──

  let tLotes=0, tAves=0, tHuevos=0, tMort=0, tMortPrev=0, postAcum=[];
  granjasMostrar.forEach(g => {
    const d = state.datos[g.id]; if (!d) return;
    d.lotes.forEach(l => {
      const k = kpisLoteSemana(l, semana.inicio, semana.fin);
      if (!k.dias) return;
      tLotes++; tAves += k.avesIni || 0; tHuevos += k.huevos || 0; tMort += k.mort || 0;
      if (k.postura!=null) postAcum.push(k.postura);
      const kp = kpisLoteSemana(l, semPrev.inicio, semPrev.fin);
      tMortPrev += kp.mort || 0;
    });
  });
  const postProm = postAcum.length ? (postAcum.reduce((a,b)=>a+b,0)/postAcum.length).toFixed(1) : '—';
  const mortPctTot = tAves>0 ? (tMort/tAves*100).toFixed(2) : '—';

  const cards = document.createElement('div');
  cards.className = 'kpi-grid'; cards.style.cssText = 'grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:22px';
  const mkCard = (label, val, sub, col) => {

    return c;
  };

    mkCard('Aves', tAves.toLocaleString('es-CL'), 'en producción'),
    mkCard('Huevos '+uniLbl, tHuevos.toLocaleString('es-CL'), 'total del periodo'),
    mkCard('Postura prom.', postProm+'%', 'promedio de lotes'),
    mkCard('Mortalidad '+uniLbl, tMort.toLocaleString('es-CL'), mortPctTot+'% · ant: '+tMortPrev, tMort>tMortPrev?'var(--mal)':'var(--ok)'),
  );
  wrap.appendChild(cards);

  // ── Panel de comparación por semana de vida (no se imprime) ──

  wrap.appendChild(panelCmp);

    .forEach(t => { const c=document.createElement('div'); c.className='resumen-cel'; c.textContent=t; cab.appendChild(c); });
  grid.appendChild(cab);

  // Filas por lote

      const diasConDatos = k.dias;
      const incompleto = diasConDatos < minDias;
      const deltaStd = (k.postura!=null && k.estandar!=null) ? parseFloat((k.postura - k.estandar).toFixed(1)) : null;

      // Semáforo según postura vs estándar
      let color, etiq;
      if (incompleto)           { color='#c2691c'; etiq='Incompleto'; }
      else if (k.postura==null) { color='#6a7565';    etiq='Sin datos';  }
      else if (deltaStd>=0)     { color='#2f7d32'; etiq='Sobre estándar'; }
      else if (deltaStd>=-3)    { color='#b8860b'; etiq='Leve baja';  }
      else                      { color='#b03a2e'; etiq='Bajo estándar'; }

      const fila = document.createElement('div');
      fila.className = 'resumen-fila' + (incompleto ? ' resumen-pendiente' : '');

      // Productor / Lote (+ semáforo + botón gráfico)

        + `<div class="semaforo" style="margin-top:3px"><div class="semaforo-dot" style="background:${color}"></div><span style="color:${color};font-size:10px">${etiq}</span></div>`;
      const btnG = document.createElement('button'); btnG.className = 'btn-mini no-print';
      btnG.textContent = '📈 Ver gráfico';

      btnG.onclick = () => {
        if (panelG) { chartG && chartG.destroy(); panelG.remove(); panelG=null; chartG=null; btnG.textContent='📈 Ver gráfico'; return; }
        panelG = document.createElement('div'); panelG.className = 'no-print';
        panelG.style.cssText = 'background:var(--papel);border-bottom:1px solid var(--linea);padding:14px 16px';
        const cv = document.createElement('canvas'); cv.style.cssText='width:100%;max-height:240px';
        panelG.appendChild(cv);

        chartG = dibujarCurva(cv, [{ label:l.nombre, registros:l.registros, color:g.color }], { conEstandar: true });
        btnG.textContent = '✕ Ocultar gráfico';
      };
      cProd.appendChild(btnG);

      // Sem vida
      const cSem = document.createElement('div'); cSem.className='resumen-cel';
      cSem.innerHTML=`<div class="resumen-num" style="color:var(--prim)">${l.semanaVida||'—'}</div><div class="resumen-sub">semanas</div>`;

      // Postura / Estándar
      const cP = document.createElement('div'); cP.className='resumen-cel';
      cP.innerHTML = k.postura!=null
        ? `<div class="resumen-num" style="color:${color}">${k.postura}%</div><div class="resumen-sub">estándar ${k.estandar!=null?k.estandar+'%':'—'} · ${diasConDatos}d</div>`
        : `<div style="color:var(--tenue);font-size:13px">Sin datos</div>`;

      // Δ vs estándar
      const cD = document.createElement('div'); cD.className='resumen-cel';
      if (deltaStd!=null) {
        const bg = deltaStd>=0?'rgba(47,125,50,.12)':'rgba(176,58,46,.1)';
        const col= deltaStd>=0?'var(--ok)':'var(--mal)';
        cD.innerHTML=`<span class="delta-chip" style="background:${bg};color:${col}">${deltaStd>0?'+':''}${deltaStd}%</span>`;
      } else cD.innerHTML=`<span style="color:var(--tenue)">—</span>`;

      // Mortalidad semana (con la anterior)
      const cM = document.createElement('div'); cM.className='resumen-cel';
      const mc = (k.mortPct!=null && k.mortPct>2.1)?'var(--mal)':(k.mortPct>0.7?'#c2691c':'var(--prim)');
      cM.innerHTML = k.dias
        ? `<div class="resumen-num" style="color:${mc};font-size:18px">${k.mort}</div><div class="resumen-sub">${k.mortPct!=null?k.mortPct+'%':''} · ant: ${kp.mort||0}</div>`
        : `<span style="color:var(--tenue)">—</span>`;

      // Consumo g/ave/día
      const cC = document.createElement('div'); cC.className='resumen-cel';
      cC.innerHTML = k.consumo!=null
        ? `<div class="resumen-num" style="color:var(--prim);font-size:18px">${k.consumo}</div><div class="resumen-sub">g/ave/día</div>`
        : `<span style="color:var(--tenue)">—</span>`;

      // Huevos semana
      const cH = document.createElement('div'); cH.className='resumen-cel';
      cH.innerHTML = k.huevos>0
        ? `<div class="resumen-num" style="color:var(--prim);font-size:18px">${k.huevos.toLocaleString('es-CL')}</div><div class="resumen-sub">${diasConDatos}d</div>`
        : `<div style="font-size:12px;color:var(--tenue)">${diasConDatos}d</div>`;

      fila.append(cProd, cSem, cP, cD, cM, cC, cH);
      grid.appendChild(fila);
    });
  });

  if (!hayDatos) {
    const vacia = document.createElement('div');
    vacia.className='resumen-fila';
    vacia.style.cssText='grid-column:1/-1;padding:32px;color:var(--tenue);text-align:center;font-size:13px';
    vacia.textContent='No hay datos cargados aún. Espera que termine de cargar.';
    grid.appendChild(vacia);
  }
  wrap.appendChild(grid);

  // Pie explicativo
  const pie = document.createElement('div'); pie.className='resumen-pie';
  pie.innerHTML=`<strong>Período:</strong> ${fmtFecha(semana.inicio)} al ${fmtFecha(semana.fin)} &nbsp;·&nbsp; <strong>Postura/Estándar:</strong> promedio de los días registrados vs curva de la línea genética &nbsp;·&nbsp; <strong>Δ estándar:</strong> diferencia real − esperado &nbsp;·&nbsp; <strong>Mortalidad:</strong> suma del periodo (% sobre aves iniciales) y "ant." = periodo previo del mismo largo &nbsp;·&nbsp; <strong>Consumo:</strong> g de alimento / ave / día &nbsp;·&nbsp; <strong>Incompleto:</strong> menos de ${minDias} de ${diasPeriodo} días registrados &nbsp;·&nbsp; <strong>Gracia:</strong> 3 días tras el cierre del periodo.`;
  wrap.appendChild(pie);

  main.appendChild(wrap);
}

function copiarResumenTexto(semana, granjasMostrar, minDias, uniLbl) {
  const fmtFecha = s => new Date(s+'T12:00:00').toLocaleDateString('es-CL', {day:'numeric',month:'short'});
  const semPrev = getPeriodoPrev(semana);
  const tipo = agrupacion==='mes' ? 'MENSUAL' : agrupacion==='4semanas' ? '4 SEMANAS' : 'SEMANAL';
  const periodoTxt = agrupacion==='mes'
    ? semana.etiqueta.charAt(0).toUpperCase()+semana.etiqueta.slice(1)
    : fmtFecha(semana.inicio)+' – '+fmtFecha(semana.fin);
  const n = v => v==null ? '—' : v.toLocaleString('es-CL');
  const signo = v => (v>0?'+':'')+v;

  let txt = `📊 RESUMEN ${tipo} AVIVET\n`;
  txt += `Período: ${periodoTxt}\n`;
  txt += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;

  granjasMostrar.forEach(g => {
    const d = state.datos[g.id]; if (!d || !d.lotes.length) return;
    txt += `\n▸ ${g.nombre.toUpperCase()}\n`;
    d.lotes.forEach(l => {
      const k  = kpisLoteSemana(l, semana.inicio, semana.fin);
      const kp = kpisLoteSemana(l, semPrev.inicio, semPrev.fin);
      const deltaStd = (k.postura!=null && k.estandar!=null) ? parseFloat((k.postura-k.estandar).toFixed(1)) : null;
      let sem;
      if (k.dias < minDias)      sem = '🟠 Incompleto';
      else if (k.postura==null)  sem = '⚪ Sin datos';
      else if (deltaStd>=0)      sem = '🟢 Sobre estándar';
      else if (deltaStd>=-3)     sem = '🟡 Leve baja';
      else                       sem = '🔴 Bajo estándar';
      txt += `${l.nombre} · Sem ${l.semanaVida ?? '?'} de vida · ${sem}\n`;
      if (!k.dias) { txt += `  Sin registros en el periodo\n`; return; }
      txt += `  Postura: ${k.postura!=null?k.postura+'%':'—'} (estándar ${k.estandar!=null?k.estandar+'%':'—'}`
           + (deltaStd!=null?`, ${signo(deltaStd)}%`:'') + `) · ${k.dias} días registrados\n`;
      txt += `  Huevos: ${n(k.huevos)} · Mortalidad: ${n(k.mort)}${k.mortPct!=null?' ('+k.mortPct+'%)':''} · anterior: ${n(kp.mort||0)}\n`;
      if (k.consumo!=null) txt += `  Consumo: ${k.consumo} g/ave/día\n`;
    });
  });

  txt += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  txt += `AviVet.cl · Dr. Andrés Lazo Escobar, MV`;
  navigator.clipboard.writeText(txt).then(() => {
    alert('Resumen copiado al portapapeles.');
  }).catch(() => {
    prompt('Copia este texto:', txt);
  });
}

async function cargarDatos() {
  try {
    await cargarNombresProductores();
    const lotes = await sbFetch('lotes', {'activo':'eq.true','select':'*','order':'nombre.asc'});
    const porUsuario = {};
    nombresLegacy = {};
    lotes.forEach(l => {
      if (l.productor) nombresLegacy[l.user_id] = l.productor;  // conserva nombres antiguos si la columna existe
      if (!porUsuario[l.user_id]) porUsuario[l.user_id] = {uid:l.user_id, lotes:[]};
      porUsuario[l.user_id].lotes.push(l);
    });
    Object.values(porUsuario).forEach(g => { g.nombre = resolverNombreProductor(g.uid); });
    GRANJAS = Object.values(porUsuario)
      .sort((a,b)=>a.nombre.localeCompare(b.nombre))
      .map((g,i)=>({ id:g.uid, nombre:g.nombre, color:PALETTE[i%PALETTE.length], _lotes:g.lotes }));
    if (GRANJAS.length) state.granjaId = GRANJAS[0].id;
    GRANJAS.forEach(g => { state.estados[g.id]='cargando'; });
    refrescar();

    // Todos los lotes de todos los productores en paralelo (antes era uno por uno)
    await Promise.all(GRANJAS.map(async granja => {
      try {
        const resultados = await Promise.all(granja._lotes.map(lote =>
          sbFetch('registros', {
            'lote_id': 'eq.'+lote.id,
            'select':  'fecha,semana_vida,n_aves,mortalidad,kg_alimento,n_huevos,chico,mediano,grande,xl,super_xl,jumbo,sucios,rotos,trizados,sangre,pct_postura,pct_esperado,diferencia',
            'order':   'fecha.desc',
            'limit':   '1000',   // ~2,7 años: cubre la vida completa de un lote para la curva por semana de vida
          }).then(regs => procesarLote(lote, regs))
        ));
        state.datos[granja.id] = { fechaConsulta: hoyISO(), lotes: resultados.filter(Boolean) };
        state.estados[granja.id] = 'ok';
      } catch(e) { state.estados[granja.id]='error'; }
      // Refresco parcial: sidebar siempre; el panel principal solo si es el productor que se está viendo
      if (modoResumen) renderResumen();
      else { renderSidebar(); if (granja.id === state.granjaId) renderMain(); }
    }));
    refrescar();
  } catch(e) {
    console.error('Error:', e);
    document.getElementById('contenido').innerHTML =
      `<div class="estado-msg"><div style="font-size:28px">⚠</div><div class="estado-msg-titulo" style="color:var(--mal)">Error al conectar</div><div class="estado-msg-sub">${e.message}</div></div>`;
  }
}
</script>
